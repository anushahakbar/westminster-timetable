<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University of Westminster Timetable</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #333;
    background: white;
}

header {
    height: 75px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
}

.logo {
    font-weight: bold;
    font-size: 21px;
    line-height: 0.9;
    color: #111;
}

.logo span {
    display: block;
}

.menu {
    background: #3d91d6;
    border: none;
    color: white;
    width: 46px;
    height: 46px;
    border-radius: 5px;
    font-size: 26px;
    cursor: pointer;
}

.toolbar {
    height: 55px;
    background: #3d91d6;
    margin: 10px 10px 0;
    border-radius: 5px 5px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
}

.tool {
    width: 37px;
    height: 37px;
    border-radius: 50%;
    border: 1px solid white;
    background: transparent;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.tools {
    display: flex;
    gap: 10px;
}

.date {
    margin: 0 10px;
    padding: 10px;
    border: 1px solid #ddd;
    border-top: none;
    text-align: center;
    font-weight: bold;
}

.navigation {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px;
}

.navigation button {
    background: white;
    border: 1px solid #aaa;
    border-radius: 4px;
    padding: 7px 15px;
    cursor: pointer;
}

.timeline {
    position: relative;
    margin: 0 10px;
    min-height: 1250px;
    border: 1px solid #ddd;
    background:
        repeating-linear-gradient(
            to bottom,
            white 0px,
            white 49px,
            #ddd 50px
        );
}

.hour {
    height: 50px;
    border-bottom: 1px dotted #ccc;
    position: relative;
}

.hour span {
    position: absolute;
    left: 5px;
    top: 2px;
    font-size: 12px;
    color: #377fb9;
    background: white;
    padding-right: 4px;
}

.event {
    position: absolute;
    left: 85px;
    right: 12px;
    background: #6da9d7;
    border-left: 5px solid #2e6f9f;
    color: white;
    padding: 8px 10px;
    border-radius: 3px;
    box-shadow: 0 1px 3px #aaa;
    font-size: 14px;
    overflow: hidden;
}

.event strong {
    display: block;
    margin-bottom: 4px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 35px;
}

/* MENU */

.menuPanel {
    display: none;
    position: fixed;
    right: 12px;
    top: 68px;
    width: 240px;
    background: white;
    border: 1px solid #aaa;
    box-shadow: 0 4px 15px #999;
    z-index: 50;
}

.menuPanel button {
    display: block;
    width: 100%;
    border: none;
    background: white;
    text-align: left;
    padding: 15px;
    cursor: pointer;
    font-size: 15px;
}

.menuPanel button:hover {
    background: #eee;
}

/* CALENDAR */

.calendarOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 100;
    overflow-y: auto;
    padding: 20px;
}

.calendar {
    max-width: 950px;
    margin: 25px auto;
    background: white;
    border-radius: 6px;
    padding: 20px;
}

.calendarHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 20px;
}

.calendarHeader button {
    border: 1px solid #aaa;
    background: white;
    padding: 7px 12px;
    border-radius: 4px;
    cursor: pointer;
}

.closeCalendar {
    background: #3d91d6 !important;
    color: white !important;
    border-color: #3d91d6 !important;
}

.months {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.month {
    border: 1px solid #ddd;
    padding: 8px;
}

.month h3 {
    text-align: center;
    margin: 4px 0 10px;
}

.weekdays,
.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
}

.weekdays {
    color: #777;
    font-size: 11px;
}

.days {
    gap: 2px;
}

.days button {
    min-height: 29px;
    border: none;
    background: white;
    border-radius: 3px;
    cursor: pointer;
}

.days button:hover {
    background: #e5f2fc;
}

.days .hasClass {
    color: #17679f;
    font-weight: bold;
    text-decoration: underline;
}

.days .today {
    outline: 2px solid #3d91d6;
}

@media(max-width:650px) {
    .months {
        grid-template-columns: 1fr;
    }

    .event {
        left: 65px;
        right: 5px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <span>UNIVERSITY</span>
        <span>OF</span>
        <span>WESTMINSTER</span>
    </div>

    <button class="menu" onclick="toggleMenu()">☰</button>

</header>


<div class="toolbar">

    <div class="tools">

        <button class="tool" onclick="changeDay(-1)">
            ‹
        </button>

        <button class="tool" onclick="openCalendar()">
            ▦
        </button>

        <button class="tool" onclick="changeDay(1)">
            ›
        </button>

    </div>

    <button class="tool" onclick="goToday()">
        ⌖
    </button>

</div>


<!-- HAMBURGER MENU -->

<div id="menuPanel" class="menuPanel">

    <button onclick="openCalendar(); toggleMenu()">
        Calendar
    </button>

    <button onclick="goToday(); toggleMenu()">
        Today
    </button>

    <button onclick="changeDay(-1); toggleMenu()">
        Previous day
    </button>

    <button onclick="changeDay(1); toggleMenu()">
        Next day
    </button>

</div>


<div id="date" class="date"></div>


<div class="navigation">

    <button onclick="changeDay(-1)">
        ← Previous
    </button>

    <button onclick="goToday()">
        Today
    </button>

    <button onclick="changeDay(1)">
        Next →
    </button>

</div>


<div id="timeline" class="timeline"></div>


<!-- CALENDAR -->

<div id="calendarOverlay" class="calendarOverlay">

    <div class="calendar">

        <div class="calendarHeader">

            <button onclick="changeCalendarYear(-1)">
                ← Year
            </button>

            <strong id="calendarYear"></strong>

            <button onclick="changeCalendarYear(1)">
                Year →
            </button>

            <button
                class="closeCalendar"
                onclick="closeCalendar()">
                Close
            </button>

        </div>

        <div id="months" class="months"></div>

    </div>

</div>


<script>

/* =====================================================
   OCCASIONAL EXTRA CLASSES
   ===================================================== */

const extraEvents = {

    "2026-09-15": [
        ["Course Introduction", 14, 15]
    ],

    "2026-09-29": [
        ["Academic Skills Workshop", 10, 12]
    ],

    "2026-10-06": [
        ["Library Induction", 11, 12]
    ],

    "2026-10-20": [
        ["Tutorial", 9, 10]
    ],

    "2026-10-30": [
        ["Guest Lecture", 13, 14.5]
    ],

    "2026-11-03": [
        ["Research Methods Workshop", 10, 12]
    ],

    "2026-11-17": [
        ["Tutorial", 11, 12]
    ],

    "2026-11-27": [
        ["Study Skills Session", 14, 15.5]
    ],

    "2026-12-01": [
        ["Revision Workshop", 10, 12]
    ],

    "2026-12-08": [
        ["Final Lecture Preparation", 11, 12]
    ]

};


/* =====================================================
   SPECIAL EVENTS
   ===================================================== */

/*
   17 SEPTEMBER:
   Welcome & Induction
   3 PM → 4 PM ONLY
*/

const fixedEvents = {

    "2026-09-17": [
        ["Welcome & Induction", 15, 16]
    ]

};


/* =====================================================
   WEEKLY WEDNESDAY / THURSDAY CLASSES
   =====================================================

   These deliberately move between Wednesday
   and Thursday.

   Some finish at 5:30 PM.
   ===================================================== */

const midweek = {

    /* SEPTEMBER */

    "2026-09-23": [
        ["Seminar", 14, 17]
    ],

    "2026-10-01": [
        ["Seminar", 14, 17.5]
    ],


    /* OCTOBER */

    "2026-10-07": [
        ["Seminar", 14, 17]
    ],

    "2026-10-15": [
        ["Seminar", 14, 17.5]
    ],

    "2026-10-21": [
        ["Seminar", 14, 17]
    ],

    "2026-10-29": [
        ["Seminar", 14, 17.5]
    ],


    /* NOVEMBER */

    "2026-11-04": [
        ["Seminar", 14, 17]
    ],

    "2026-11-12": [
        ["Seminar", 14, 17.5]
    ],

    "2026-11-18": [
        ["Seminar", 14, 17]
    ],

    "2026-11-26": [
        ["Seminar", 14, 17.5]
    ],


    /* DECEMBER */

    "2026-12-02": [
        ["Seminar", 14, 17]
    ],

    "2026-12-10": [
        ["Seminar", 14, 17.5]
    ]

};


/* =====================================================
   WINTER BREAK + EXAM PERIOD
   ===================================================== */

const noTeachingStart =
    new Date(2026, 11, 12);

const noTeachingEnd =
    new Date(2027, 0, 15);


/* =====================================================
   DATE FUNCTIONS
   ===================================================== */

function getKey(date) {

    return date.getFullYear()
        + "-"
        + String(date.getMonth() + 1).padStart(2, "0")
        + "-"
        + String(date.getDate()).padStart(2, "0");

}


function getToday() {

    const now = new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

}


let selectedDate = getToday();

let calendarYearValue =
    selectedDate.getFullYear();


/* =====================================================
   CHECK IF DATE IS HOLIDAY / EXAM PERIOD
   ===================================================== */

function isNoTeaching(date) {

    return (
        date >= noTeachingStart &&
        date <= noTeachingEnd
    );

}


/* =====================================================
   GET EVENTS
   ===================================================== */

function getEvents(date) {

    const key = getKey(date);

    /*
       Nothing happens during the
       winter break / exam period.
    */

    if (isNoTeaching(date)) {
        return [];
    }


    let events = [];


    /* Special events */

    if (fixedEvents[key]) {

        events.push(
            ...fixedEvents[key]
        );

    }


    /* Random extra classes */

    if (extraEvents[key]) {

        events.push(
            ...extraEvents[key]
        );

    }


    /* Wednesday / Thursday class */

    if (midweek[key]) {

        events.push(
            ...midweek[key]
        );

    }


    /*
       EVERY MONDAY:
       3 PM → 5 PM
    */

    if (date.getDay() === 1) {

        events.push([
            "Lecture",
            15,
            17
        ]);

    }


    return events;

}


/* =====================================================
   DATE DISPLAY
   ===================================================== */

function formatDate(date) {

    return date.toLocaleDateString(
        undefined,
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   TIME DISPLAY
   ===================================================== */

function formatTime(hour) {

    const wholeHour =
        Math.floor(hour);

    const minutes =
        Math.round(
            (hour - wholeHour) * 60
        );

    const ampm =
        wholeHour >= 12
            ? "PM"
            : "AM";

    const displayHour =
        wholeHour % 12 || 12;

    return displayHour
        + (
            minutes
                ? ":" + String(minutes).padStart(2, "0")
                : ""
        )
        + " "
        + ampm;

}


/* =====================================================
   RENDER TIMETABLE
   ===================================================== */

function render() {

    document.getElementById("date")
        .textContent =
        formatDate(selectedDate);


    const timeline =
        document.getElementById("timeline");

    timeline.innerHTML = "";


    /*
       Timetable from 8 AM to 8 PM
    */

    for (
        let hour = 8;
        hour <= 20;
        hour++
    ) {

        const row =
            document.createElement("div");

        row.className = "hour";


        const label =
            document.createElement("span");

        label.textContent =
            formatTime(hour);


        row.appendChild(label);

        timeline.appendChild(row);

    }


    const events =
        getEvents(selectedDate);


    /* Draw classes */

    events.forEach(event => {

        const name = event[0];
        const start = event[1];
        const end = event[2];


        const box =
            document.createElement("div");

        box.className = "event";


        /*
           Timeline starts at 8 AM.
           One hour = 50 pixels.
        */

        box.style.top =
            ((start - 8) * 50)
            + "px";


        box.style.height =
            Math.max(
                ((end - start) * 50) - 4,
                35
            )
            + "px";


        box.innerHTML =
            "<strong>"
            + name
            + "</strong>"
            + formatTime(start)
            + " – "
            + formatTime(end);


        timeline.appendChild(box);

    });


    /* Empty day */

    if (events.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";


        if (isNoTeaching(selectedDate)) {

            empty.textContent =
                "No scheduled teaching";

        } else {

            empty.textContent =
                "No scheduled classes";

        }


        timeline.appendChild(empty);

    }

}


/* =====================================================
   DAY NAVIGATION
   ===================================================== */

function changeDay(amount) {

    selectedDate.setDate(
        selectedDate.getDate() + amount
    );

    render();

}


function goToday() {

    selectedDate = getToday();

    calendarYearValue =
        selectedDate.getFullYear();

    render();

}


/* =====================================================
   HAMBURGER MENU
   ===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById("menuPanel");


    if (
        menu.style.display === "block"
    ) {

        menu.style.display = "none";

    } else {

        menu.style.display = "block";

    }

}


/* =====================================================
   CALENDAR
   ===================================================== */

function openCalendar() {

    calendarYearValue =
        selectedDate.getFullYear();


    document.getElementById(
        "calendarOverlay"
    ).style.display = "block";


    renderCalendar();

}


function closeCalendar() {

    document.getElementById(
        "calendarOverlay"
    ).style.display = "none";

}


function changeCalendarYear(amount) {

    calendarYearValue += amount;

    renderCalendar();

}


/* =====================================================
   RENDER YEAR CALENDAR
   ===================================================== */

function renderCalendar() {

    document.getElementById(
        "calendarYear"
    ).textContent =
        calendarYearValue;


    const months =
        document.getElementById("months");

    months.innerHTML = "";


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const monthBox =
            document.createElement("div");

        monthBox.className = "month";


        const title =
            document.createElement("h3");

        title.textContent =
            new Date(
                calendarYearValue,
                month,
                1
            ).toLocaleDateString(
                undefined,
                {
                    month: "long"
                }
            );


        monthBox.appendChild(title);


        /*
           Weekdays
        */

        const weekdays =
            document.createElement("div");

        weekdays.className =
            "weekdays";


        [
            "M",
            "T",
            "W",
            "T",
            "F",
            "S",
            "S"
        ].forEach(day => {

            const span =
                document.createElement("span");

            span.textContent = day;

            weekdays.appendChild(span);

        });


        monthBox.appendChild(weekdays);


        /*
           Days
        */

        const days =
            document.createElement("div");

        days.className = "days";


        const firstDay =
            new Date(
                calendarYearValue,
                month,
                1
            );


        /*
           Convert Sunday-first JavaScript
           dates into Monday-first calendar.
        */

        const offset =
            (firstDay.getDay() + 6) % 7;


        for (
            let i = 0;
            i < offset;
            i++
        ) {

            days.appendChild(
                document.createElement("span")
            );

        }


        const numberOfDays =
            new Date(
                calendarYearValue,
                month + 1,
                0
            ).getDate();


        for (
            let day = 1;
            day <= numberOfDays;
            day++
        ) {

            const date =
                new Date(
                    calendarYearValue,
                    month,
                    day
                );


            const button =
                document.createElement("button");


            button.textContent = day;


            /*
               Dates with classes
            */

            if (
                getEvents(date).length > 0
            ) {

                button.classList.add(
                    "hasClass"
                );

            }


            /*
               Today's date
            */

            if (
                getKey(date) ===
                getKey(getToday())
            ) {

                button.classList.add(
                    "today"
                );

            }


            /*
               Currently selected date
            */

            if (
                getKey(date) ===
                getKey(selectedDate)
            ) {

                button.style.background =
                    "#dfefff";

            }


            /*
               Click date
            */

            button.onclick = function() {

                selectedDate = date;

                closeCalendar();

                render();

            };


            days.appendChild(button);

        }


        monthBox.appendChild(days);

        months.appendChild(monthBox);

    }

}


/* =====================================================
   START
   ===================================================== */

render();

</script>

</body>
</html>
