 <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>University Timetable</title>

<style>
:root {
  --blue: #3d91d6;
  --line: #d7d7d7;
  --text: #333;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: #fff;
}

.page {
  max-width: 900px;
  margin: auto;
}

/* HEADER */

header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-bottom: 1px solid #ddd;
}

.logo {
  font-weight: 800;
  font-size: 24px;
  line-height: .9;
  letter-spacing: -1.5px;
  color: #111;
}

.logo span {
  display: block;
}

.menu {
  border: 0;
  background: var(--blue);
  color: #fff;
  border-radius: 5px;
  font-size: 27px;
  width: 46px;
  height: 48px;
  cursor: pointer;
}

/* BLUE TOOLBAR */

.toolbar {
  height: 54px;
  background: var(--blue);
  margin: 10px 10px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  border-radius: 5px 5px 0 0;
}

.tools {
  display: flex;
  gap: 11px;
}

.tool {
  width: 36px;
  height: 36px;
  border: 1px solid #fff;
  border-radius: 50%;
  background: transparent;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* DATE */

.daytitle {
  margin: 0 10px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-top: 0;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
}

/* NAVIGATION */

.nav {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 10px;
}

.nav button {
  background: #fff;
  border: 1px solid #bbb;
  border-radius: 4px;
  padding: 6px 14px;
  cursor: pointer;
}

/* TIMELINE */

.timeline {
  margin: 0 10px;
  border: 1px solid var(--line);
  position: relative;
  min-height: 1200px;
  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0,
      #fff 49px,
      #e7e7e7 50px
    );
}

.hour {
  height: 50px;
  position: relative;
  border-bottom: 1px dotted #ccc;
}

.hour span {
  position: absolute;
  left: 5px;
  top: 2px;
  color: #377fb9;
  font-size: 12px;
  background: #fff;
  padding-right: 4px;
}

/* CLASS */

.event {
  position: absolute;
  left: 82px;
  right: 12px;
  background: #6da9d7;
  border-left: 5px solid #2e6f9f;
  color: #fff;
  padding: 8px 10px;
  border-radius: 2px;
  box-shadow: 0 1px 2px #aaa;
  font-size: 14px;
  overflow: hidden;
}

.event b {
  display: block;
  margin-bottom: 3px;
}

.empty {
  padding: 30px;
  text-align: center;
  color: #777;
}

/* MENU */

.menuPanel {
  display: none;
  position: fixed;
  right: 12px;
  top: 68px;
  width: 240px;
  background: #fff;
  border: 1px solid #bbb;
  border-radius: 4px;
  box-shadow: 0 4px 14px #999;
  z-index: 20;
}

.menuPanel button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: #fff;
  padding: 14px 16px;
  font-size: 15px;
  cursor: pointer;
}

.menuPanel button:hover {
  background: #eee;
}

/* CALENDAR */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 30;
  padding: 20px;
  overflow: auto;
}

.calendar {
  max-width: 900px;
  margin: 30px auto;
  background: #fff;
  border-radius: 6px;
  padding: 18px;
}

.calHead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  gap: 8px;
}

.calHead button {
  border: 1px solid #aaa;
  background: #fff;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
}

.months {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 16px;
}

.month {
  border: 1px solid var(--line);
  padding: 8px;
}

.month h3 {
  text-align: center;
  margin: 3px 0 8px;
  font-size: 15px;
}

.week {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  font-size: 11px;
  color: #777;
  text-align: center;
}

.days {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 2px;
}

.days button {
  border: 0;
  background: #fff;
  min-height: 28px;
  cursor: pointer;
  border-radius: 3px;
}

.days button:hover {
  background: #dfefff;
}

.days .has {
  font-weight: bold;
  color: #17679f;
  text-decoration: underline;
}

.days .today {
  outline: 1px solid var(--blue);
}

.close {
  background: var(--blue) !important;
  color: #fff !important;
  border-color: var(--blue) !important;
}

/* MOBILE */

@media(max-width:650px) {

  .months {
    grid-template-columns: 1fr;
  }

  .timeline {
    min-height: 1200px;
  }

  .event {
    left: 65px;
    right: 5px;
  }

  .logo {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="page">

<header>

  <div class="logo">
    <span>UNIVERSITY</span>
    <span>OF</span>
    <span>WESTMINSTER</span>
  </div>

  <button class="menu" onclick="toggleMenu()">☰</button>

</header>


<!-- BLUE TOOLBAR -->

<div class="toolbar">

  <div class="tools">

    <button
      class="tool"
      onclick="changeDay(-1)"
      title="Previous day">
      ‹
    </button>

    <button
      class="tool"
      onclick="openCalendar()"
      title="Calendar">
      ▦
    </button>

    <button
      class="tool"
      onclick="changeDay(1)"
      title="Next day">
      ›
    </button>

  </div>

  <button
    class="tool"
    onclick="goToday()"
    title="Today">
    ⌖
  </button>

</div>


<!-- HAMBURGER MENU -->

<div id="menuPanel" class="menuPanel">

  <button onclick="openCalendar();toggleMenu()">
    Calendar
  </button>

  <button onclick="goToday();toggleMenu()">
    Today
  </button>

  <button onclick="changeDay(-1);toggleMenu()">
    Previous day
  </button>

  <button onclick="changeDay(1);toggleMenu()">
    Next day
  </button>

</div>


<!-- DATE -->

<div id="daytitle" class="daytitle"></div>


<!-- NAVIGATION -->

<div class="nav">

  <button onclick="changeDay(-1)">
    ← Previous
  </button>

  <button onclick="goToday()">
    Today
  </button>

  <button onclick="changeDay(1)">
    Next →
  </button>

</div>


<!-- TIMETABLE -->

<div id="timeline" class="timeline"></div>

</div>


<!-- CALENDAR OVERLAY -->

<div id="overlay" class="overlay">

  <div class="calendar">

    <div class="calHead">

      <button onclick="calendarYear(-1)">
        ← Year
      </button>

      <strong id="calYear"></strong>

      <button onclick="calendarYear(1)">
        Year →
      </button>

      <button
        class="close"
        onclick="closeCalendar()">
        Close
      </button>

    </div>

    <div id="months" class="months"></div>

  </div>

</div>


<script>

/* ==========================================
   EXTRA RANDOM CLASSES
   ========================================== */

const extraEvents = {

  "2026-09-15": [
    ["Course Introduction", 14, 15]
  ],

  "2026-09-22": [
    ["Tutorial", 10, 11]
  ],

  "2026-09-30": [
    ["Study Skills", 11, 12]
  ],

  "2026-10-06": [
    ["Workshop", 10, 12]
  ],

  "2026-10-20": [
    ["Tutorial", 9, 10]
  ],

  "2026-11-03": [
    ["Guest Lecture", 11, 12]
  ],

  "2026-11-12": [
    ["Study Skills", 10, 12]
  ],

  "2026-11-26": [
    ["Workshop", 13, 16]
  ]

};


/* ==========================================
   WELCOME & INDUCTION
   ========================================== */

const fixedEvents = {

  "2026-09-17": [
    ["Welcome & Induction", 10, 12]
  ]

};


/* ==========================================
   MIDWEEK CLASSES
   ==========================================

   These alternate between Wednesday
   and Thursday.

   Some finish at 5:30 PM.
   ========================================== */

const midweek = {

  /* SEPTEMBER */

  "2026-09-17": [
    ["Welcome & Induction", 10, 12]
  ],

  "2026-09-23": [
    ["Seminar", 14, 17]
  ],


  /* OCTOBER */

  "2026-10-01": [
    ["Seminar", 14, 17.5]
  ],

  "2026-10-08": [
    ["Seminar", 14, 17]
  ],

  "2026-10-14": [
    ["Seminar", 14, 17.5]
  ],

  "2026-10-22": [
    ["Seminar", 14, 17]
  ],

  "2026-10-28": [
    ["Seminar", 14, 17.5]
  ],


  /* NOVEMBER */

  "2026-11-05": [
    ["Seminar", 14, 17]
  ],

  "2026-11-11": [
    ["Seminar", 14, 17.5]
  ],

  "2026-11-19": [
    ["Seminar", 14, 17]
  ],

  "2026-11-25": [
    ["Seminar", 14, 17.5]
  ],


  /* DECEMBER */

  "2026-12-03": [
    ["Seminar", 14, 17]
  ],

  "2026-12-09": [
    ["Seminar", 14, 17.5]
  ]

};


/* ==========================================
   NO TEACHING PERIOD
   ========================================== */

const noTeachingStart =
  new Date(2026, 11, 12);

const noTeachingEnd =
  new Date(2027, 0, 15);


/* ==========================================
   DATE HELPERS
   ========================================== */

function key(d) {

  return d.getFullYear()
    + "-"
    + String(d.getMonth() + 1).padStart(2, "0")
    + "-"
    + String(d.getDate()).padStart(2, "0");

}


function localToday() {

  const d = new Date();

  return new Date(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  );

}


let selectedDate = localToday();

let calendarYearValue =
  selectedDate.getFullYear();


/* ==========================================
   CHECK HOLIDAY / EXAM PERIOD
   ========================================== */

function inNoTeaching(d) {

  return (
    d >= noTeachingStart &&
    d <= noTeachingEnd
  );

}


/* ==========================================
   GET CLASSES FOR A DAY
   ========================================== */

function getEvents(d) {

  const k = key(d);

  /*
     During the winter vacation and exam period
     everything stays empty.
  */

  if (inNoTeaching(d)) {
    return [];
  }


  let out = [];


  /* Fixed classes */

  if (fixedEvents[k]) {
    out.push(...fixedEvents[k]);
  }


  /* Random classes */

  if (extraEvents[k]) {
    out.push(...extraEvents[k]);
  }


  /* Wednesday / Thursday classes */

  if (midweek[k]) {
    out.push(...midweek[k]);
  }


  /*
     MONDAY IS ALWAYS CONSISTENT:
     3:00 PM → 5:00 PM
  */

  if (d.getDay() === 1) {

    out.push([
      "Lecture",
      15,
      17
    ]);

  }


  /*
     Any Thursday without a specifically
     assigned midweek class gets a normal
     2 PM → 5 PM seminar.
  */

  if (
    d.getDay() === 4 &&
    !midweek[k] &&
    !fixedEvents[k]
  ) {

    out.push([
      "Seminar",
      14,
      17
    ]);

  }


  return out;

}


/* ==========================================
   FORMAT DATE
   ========================================== */

function fmtDate(d) {

  return d.toLocaleDateString(
    undefined,
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


/* ==========================================
   FORMAT TIME
   ========================================== */

function timeLabel(h) {

  const hr = Math.floor(h);

  const mins =
    Math.round((h - hr) * 60);

  const ap =
    hr >= 12 ? "PM" : "AM";

  const x =
    hr % 12 || 12;

  return (
    x +
    (mins
      ? ":" + String(mins).padStart(2, "0")
      : ""
    )
    + " "
    + ap
  );

}


/* ==========================================
   RENDER TIMETABLE
   ========================================== */

function render() {

  document.getElementById("daytitle")
    .textContent = fmtDate(selectedDate);


  const tl =
    document.getElementById("timeline");

  tl.innerHTML = "";


  /*
     Display 8 AM → 8 PM
  */

  for (let h = 8; h <= 20; h++) {

    const row =
      document.createElement("div");

    row.className = "hour";

    row.style.height = "50px";


    const s =
      document.createElement("span");

    s.textContent =
      timeLabel(h);


    row.appendChild(s);

    tl.appendChild(row);

  }


  const events =
    getEvents(selectedDate);


  /*
     Draw each class
  */

  events.forEach(e => {

    const [
      name,
      start,
      end
    ] = e;


    const div =
      document.createElement("div");

    div.className = "event";


    /*
       50 pixels = one hour.
       Timeline starts at 8 AM.
    */

    div.style.top =
      ((start - 8) * 50) + "px";


    div.style.height =
      Math.max(
        (end - start) * 50 - 4,
        35
      ) + "px";


    div.innerHTML =
      "<b>"
      + name
      + "</b>"
      + timeLabel(start)
      + " – "
      + timeLabel(end);


    tl.appendChild(div);

  });


  /*
     Empty day
  */

  if (!events.length) {

    const x =
      document.createElement("div");

    x.className = "empty";


    x.textContent =
      inNoTeaching(selectedDate)
        ? "No scheduled teaching"
        : "No scheduled classes";


    tl.appendChild(x);

  }

}


/* ==========================================
   DAY NAVIGATION
   ========================================== */

function changeDay(n) {

  selectedDate.setDate(
    selectedDate.getDate() + n
  );

  render();

}


function goToday() {

  selectedDate = localToday();

  calendarYearValue =
    selectedDate.getFullYear();

  render();

}


/* ==========================================
   HAMBURGER MENU
   ========================================== */

function toggleMenu() {

  const p =
    document.getElementById("menuPanel");


  p.style.display =
    p.style.display === "block"
      ? "none"
      : "block";

}


/* ==========================================
   OPEN CALENDAR
   ========================================== */

function openCalendar() {

  calendarYearValue =
    selectedDate.getFullYear();

  document.getElementById("overlay")
    .style.display = "block";

  renderCalendar();

}


function closeCalendar() {

  document.getElementById("overlay")
    .style.display = "none";

}


function calendarYear(n) {

  calendarYearValue += n;

  renderCalendar();

}


/* ==========================================
   YEAR CALENDAR
   ========================================== */

function renderCalendar() {

  document.getElementById("calYear")
    .textContent = calendarYearValue;


  const months =
    document.getElementById("months");

  months.innerHTML = "";


  /*
     Display all 12 months.
  */

  for (let m = 0; m < 12; m++) {

    const box =
      document.createElement("div");

    box.className = "month";


    const h =
      document.createElement("h3");

    h.textContent =
      new Date(
        calendarYearValue,
        m,
        1
      ).toLocaleDateString(
        undefined,
        { month: "long" }
      );


    box.appendChild(h);


    /*
       Weekday headings
       Monday → Sunday
    */

    const week =
      document.createElement("div");

    week.className = "week";


    [
      "M",
      "T",
      "W",
      "T",
      "F",
      "S",
      "S"
    ].forEach(x => {

      const s =
        document.createElement("span");

      s.textContent = x;

      week.appendChild(s);

    });


    box.appendChild(week);


    const days =
      document.createElement("div");

    days.className = "days";


    /*
       Find first weekday
    */

    const first =
      new Date(
        calendarYearValue,
        m,
        1
      );


    let offset =
      (first.getDay() + 6) % 7;


    /*
       Empty spaces before
       first day of month.
    */

    for (
      let i = 0;
      i < offset;
      i++
    ) {

      days.appendChild(
        document.createElement("span")
      );

    }


    /*
       Number of days in month
    */

    const count =
      new Date(
        calendarYearValue,
        m + 1,
        0
      ).getDate();


    for (
      let day = 1;
      day <= count;
      day++
    ) {

      const d =
        new Date(
          calendarYearValue,
          m,
          day
        );


      const b =
        document.createElement("button");


      b.textContent = day;


      /*
         Highlight dates with classes.
      */

      if (getEvents(d).length) {

        b.classList.add("has");

      }


      /*
         Highlight today's date.
      */

      if (
        key(d) ===
        key(localToday())
      ) {

        b.classList.add("today");

      }


      /*
         Highlight selected date.
      */

      if (
        key(d) ===
        key(selectedDate)
      ) {

        b.style.background =
          "#dfefff";

      }


      /*
         Clicking a date opens that day.
      */

      b.onclick = () => {

        selectedDate = d;

        closeCalendar();

        render();

      };


      days.appendChild(b);

    }


    box.appendChild(days);

    months.appendChild(box);

  }

}


/* ==========================================
   START TIMETABLE
   ========================================== */

render();

</script>

</body>
</html>
