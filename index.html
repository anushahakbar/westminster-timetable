<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Westminster Timetable</title>

<style>
:root{
  --blue:#3f91d6;
  --border:#ccc;
  --grid:#ddd;
  --text:#333;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
}

.page{
  max-width:900px;
  margin:auto;
}

/* HEADER */

header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 10px;
  border-bottom:1px solid #ddd;
}

.logo{
  font-weight:800;
  font-size:25px;
  line-height:.9;
  letter-spacing:-1.5px;
  color:#111;
}

.logo span{
  display:block;
}

.menu{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:5px;
  font-size:28px;
  width:45px;
  height:48px;
  cursor:pointer;
}

/* NAVIGATION */

.toolbar{
  height:53px;
  background:var(--blue);
  margin:10px 10px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  border-radius:5px 5px 0 0;
}

.tools{
  display:flex;
  gap:12px;
}

.tool{
  width:35px;
  height:35px;
  border-radius:50%;
  border:1px solid white;
  background:transparent;
  color:white;
  font-size:19px;
  cursor:pointer;
}

/* DATE */

.datebar{
  margin:0 10px;
  height:34px;
  border:1px solid var(--border);
  background:#f7f7f7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
  font-weight:bold;
}

/* TIMETABLE */

.schedule-wrap{
  height:calc(100vh - 260px);
  min-height:520px;
  overflow:auto;
  margin:0 10px;
  border:1px solid var(--border);
  border-top:0;
}

.schedule{
  position:relative;
  min-width:430px;
  height:1365px;
}

.hour{
  height:105px;
  display:grid;
  grid-template-columns:55px 1fr;
  border-bottom:1px solid var(--border);
}

.time{
  padding:10px 8px 0 0;
  text-align:right;
  color:var(--blue);
  font-weight:bold;
  font-size:13px;
  border-right:1px solid var(--border);
}

.time small{
  font-size:9px;
}

.slot{
  position:relative;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 25px,
      var(--grid) 25px,
      var(--grid) 26px
    );
}

/* CLASS BOX */

.event{
  position:absolute;
  left:7px;
  right:7px;
  border-left:4px solid var(--blue);
  background:#eaf4fd;
  border-radius:2px;
  padding:7px 8px;
  color:#236b9f;
  font-size:13px;
  line-height:18px;
  overflow:hidden;
  box-shadow:0 0 0 1px #d8eaf7;
}

.event strong{
  display:block;
  font-size:14px;
}

.event small{
  display:block;
  color:#555;
  margin-top:2px;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:9px 10px 15px;
  font-size:13px;
}

.updated{
  color:var(--blue);
  font-weight:bold;
  line-height:18px;
}

.links{
  margin-top:8px;
  display:flex;
  justify-content:center;
  gap:18px;
  align-items:center;
}

.cmis{
  font-size:28px;
  font-weight:800;
  letter-spacing:-2px;
}

.cmis em{
  font-style:normal;
  color:#e64e57;
}

.copy{
  font-size:10px;
  color:#777;
  margin-top:6px;
  line-height:13px;
}

/* SIDE MENU */

.drawer{
  position:fixed;
  top:0;
  right:-280px;
  width:270px;
  height:100%;
  background:#fff;
  box-shadow:-3px 0 12px #0003;
  z-index:20;
  padding:20px;
  transition:.2s;
  overflow-y:auto;
}

.drawer.open{
  right:0;
}

.drawer button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  background:#f7f7f7;
  cursor:pointer;
  font-size:15px;
}

/* CALENDAR OVERVIEW */

.calendar-view{
  display:none;
  margin:0 10px;
  border:1px solid var(--border);
  padding:10px;
  background:white;
}

.calendar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--blue);
  font-weight:bold;
  margin-bottom:10px;
  font-size:17px;
}

.calendar-arrow{
  width:34px!important;
  height:34px;
  padding:0!important;
  margin:0!important;
  border-radius:50%;
  background:white!important;
  color:var(--blue);
  border:1px solid var(--blue)!important;
}

.month-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}

.month-grid div{
  min-height:55px;
  border:1px solid #ddd;
  padding:5px;
  font-size:12px;
  cursor:pointer;
}

.month-grid .weekday{
  min-height:28px;
  background:var(--blue);
  color:white;
  text-align:center;
  font-weight:bold;
  cursor:default;
}

.month-grid .has-event{
  background:#eaf4fd;
  color:#236b9f;
  font-weight:bold;
}

.month-grid .selected{
  outline:2px solid var(--blue);
}

.year-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.year-month{
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #ddd;
  color:var(--blue);
  font-weight:bold;
  cursor:pointer;
}

.year-month:hover,
.month-grid div:hover{
  background:#eef6fd;
}

/* MOBILE */

@media(max-width:600px){

  header{
    height:72px;
  }

  .logo{
    font-size:23px;
  }

  .schedule-wrap{
    height:calc(100vh - 250px);
  }

  .year-grid{
    grid-template-columns:repeat(2,1fr);
  }

}
</style>
</head>

<body>

<div class="page">

<header>

  <div class="logo">
    <span>UNIVERSITY OF</span>
    <span>WESTMINSTER ▦</span>
  </div>

  <button class="menu" id="menu">≡</button>

</header>


<div class="toolbar">

  <div class="tools">
    <button class="tool" id="prev">←</button>
    <button class="tool" id="today">▦</button>
  </div>

  <div class="tools">
    <button class="tool" id="jump">⌖</button>
    <button class="tool" id="next">→</button>
  </div>

</div>


<div class="datebar" id="date"></div>


<!-- NORMAL DAY VIEW -->

<div class="schedule-wrap" id="scroll">

  <div class="schedule" id="schedule"></div>

</div>


<!-- CALENDAR OVERVIEW -->

<div class="calendar-view" id="calendarView">

  <div class="calendar-header">

    <button class="calendar-arrow" id="calendarPrev">←</button>

    <span id="calendarTitle"></span>

    <button class="calendar-arrow" id="calendarNext">→</button>

  </div>

  <div id="calendarContent"></div>

</div>


<footer class="footer">

  <div class="updated">
    Timetabled events last full update 5:20 am on 7<br>
    September 2026
  </div>

  <div class="links">

    <span>Accessibility statement</span>

    <span class="cmis">
      cmis<em>go</em>
    </span>

    <span>About</span>

  </div>

  <div class="copy">
    © Copyright - Advanced Computer Software Group Ltd All Rights Reserved.<br>
    Advanced is a trading name of Advanced Business Software and Solutions Limited.
  </div>

</footer>

</div>


<!-- SIDE MENU -->

<div class="drawer" id="drawer">

  <button id="close">Close</button>

  <button id="timetableButton">Timetable</button>

  <button id="calendarButton">Calendar</button>

  <button>Settings</button>

</div>


<script>

/* =====================================================
   YOUR TIMETABLE
   ===================================================== */

/*
   MAIN PATTERN:
   Monday = 3:00–5:00 PM
   Thursday = 2:00–5:30 PM

   Extra classes are added occasionally.
   There are NO classes during the Christmas break.
*/

const events = [

  /* SEPTEMBER */

  ["2026-09-14","15:00","17:00","Cognitive Psychology"],
  ["2026-09-17","14:00","17:30","Biological Psychology"],

  ["2026-09-21","15:00","17:00","Cognitive Psychology"],
  ["2026-09-24","14:00","17:30","Biological Psychology"],

  ["2026-09-29","11:00","12:30","Developmental Psychology"],
  ["2026-10-01","14:00","17:30","Biological Psychology"],

  /* OCTOBER */

  ["2026-10-05","15:00","17:00","Cognitive Psychology"],
  ["2026-10-08","14:00","17:30","Biological Psychology"],

  ["2026-10-13","10:00","12:00","Research Methods"],
  ["2026-10-15","14:00","17:30","Biological Psychology"],

  ["2026-10-19","15:00","17:00","Cognitive Psychology"],
  ["2026-10-22","14:00","17:30","Biological Psychology"],

  ["2026-10-27","12:00","13:30","Individual Differences"],
  ["2026-10-29","14:00","17:30","Biological Psychology"],

  /* NOVEMBER */

  ["2026-11-02","15:00","17:00","Cognitive Psychology"],
  ["2026-11-05","14:00","17:30","Biological Psychology"],

  ["2026-11-10","10:00","12:00","Research Methods"],
  ["2026-11-12","14:00","17:30","Biological Psychology"],

  ["2026-11-16","15:00","17:00","Cognitive Psychology"],
  ["2026-11-19","14:00","17:30","Biological Psychology"],

  ["2026-11-24","11:00","13:00","Developmental Psychology"],
  ["2026-11-26","14:00","17:30","Biological Psychology"],

  ["2026-11-30","15:00","17:00","Cognitive Psychology"],

  /* DECEMBER */

  ["2026-12-03","14:00","17:30","Biological Psychology"],

  ["2026-12-07","15:00","17:00","Cognitive Psychology"],

  ["2026-12-10","14:00","17:30","Biological Psychology"]

  /*
     NO CLASSES AFTER 10 DECEMBER.
     CHRISTMAS / WINTER BREAK = EMPTY.
  */

];


/* =====================================================
   TIMETABLE SETTINGS
   ===================================================== */

const startHour = 8;
const endHour = 21;
const rowHeight = 105;

const schedule = document.getElementById("schedule");
const scroll = document.getElementById("scroll");
const dateElement = document.getElementById("date");

const calendarView = document.getElementById("calendarView");
const calendarTitle = document.getElementById("calendarTitle");
const calendarContent = document.getElementById("calendarContent");


/* =====================================================
   OPEN ON TODAY'S ACTUAL DATE
   ===================================================== */

let selectedDate = new Date();

selectedDate.setHours(12,0,0,0);


/* =====================================================
   CALENDAR VIEW
   ===================================================== */

let calendarMode = "month";

let calendarDate = new Date();

calendarDate.setHours(12,0,0,0);


/* =====================================================
   DATE FUNCTIONS
   ===================================================== */

function formatDate(date){

  return date.toLocaleDateString(
    "en-GB",
    {
      weekday:"short",
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


function dateKey(date){

  const year = date.getFullYear();

  const month =
    String(date.getMonth()+1).padStart(2,"0");

  const day =
    String(date.getDate()).padStart(2,"0");

  return year + "-" + month + "-" + day;

}


/* =====================================================
   CONVERT TIME TO MINUTES
   ===================================================== */

function minutes(time){

  if(!time){
    return 0;
  }

  const parts = time.split(":");

  return Number(parts[0]) * 60 +
         Number(parts[1]);

}


/* =====================================================
   BUILD TIMETABLE
   ===================================================== */

function buildTimetable(){

  schedule.innerHTML = "";


  /* HOURS */

  for(let hour = startHour; hour <= endHour; hour++){

    const row = document.createElement("div");

    row.className = "hour";


    const time = document.createElement("div");

    time.className = "time";


    const shownHour =
      hour % 12 || 12;


    const ampm =
      hour >= 12 ? "PM" : "AM";


    time.innerHTML =
      shownHour +
      "<small>" +
      ampm +
      "</small>";


    const slot =
      document.createElement("div");

    slot.className = "slot";


    row.appendChild(time);

    row.appendChild(slot);

    schedule.appendChild(row);

  }


  /* CURRENT DAY */

  const today =
    dateKey(selectedDate);


  const todaysEvents =
    events.filter(
      event => event[0] === today
    );


  /* ADD EVENTS */

  todaysEvents.forEach(eventData => {

    const [
      date,
      start,
      end,
      title
    ] = eventData;


    const event =
      document.createElement("div");

    event.className = "event";


    const startPosition =
      (minutes(start) -
      startHour * 60)
      / 60 *
      rowHeight;


    const duration =
      (minutes(end) -
      minutes(start))
      / 60 *
      rowHeight;


    event.style.top =
      startPosition + "px";


    event.style.height =
      Math.max(
        45,
        duration - 5
      ) + "px";


    event.innerHTML =
      "<strong>" +
      title +
      "</strong>" +

      "<small>" +
      start +
      "–" +
      end +
      "</small>";


    schedule.appendChild(event);

  });


  /* UPDATE DATE */

  dateElement.textContent =
    formatDate(selectedDate);


  scroll.scrollTop = 0;

}


/* =====================================================
   DAY NAVIGATION
   ===================================================== */

function changeDay(amount){

  selectedDate.setDate(
    selectedDate.getDate() + amount
  );

  showDay();

}


document.getElementById("prev").onclick =
  () => changeDay(-1);


document.getElementById("next").onclick =
  () => changeDay(1);


/* =====================================================
   TODAY BUTTON
   ===================================================== */

document.getElementById("today").onclick = () => {

  selectedDate = new Date();

  selectedDate.setHours(12,0,0,0);

  showDay();

};


/* =====================================================
   JUMP TO NEXT CLASS
   ===================================================== */

document.getElementById("jump").onclick = () => {

  const today =
    dateKey(selectedDate);


  const firstClass =
    events.find(
      event =>
        event[0] === today &&
        event[1]
    );


  if(firstClass){

    const position =
      (minutes(firstClass[1]) -
      startHour * 60)
      / 60 *
      rowHeight;


    scroll.scrollTo({

      top:Math.max(
        0,
        position - 100
      ),

      behavior:"smooth"

    });

  }

};


/* =====================================================
   SIDE MENU
   ===================================================== */

const drawer =
  document.getElementById("drawer");


document.getElementById("menu").onclick =
  () => drawer.classList.add("open");


document.getElementById("close").onclick =
  () => drawer.classList.remove("open");


/* =====================================================
   TIMETABLE BUTTON
   ===================================================== */

document.getElementById("timetableButton").onclick =
  () => {

    drawer.classList.remove("open");

    showDay();

  };


/* =====================================================
   CALENDAR BUTTON
   ===================================================== */

document.getElementById("calendarButton").onclick =
  () => {

    drawer.classList.remove("open");

    calendarMode = "month";

    calendarDate =
      new Date(selectedDate);

    calendarDate.setHours(12,0,0,0);

    showCalendar();

  };


/* =====================================================
   SHOW DAY
   ===================================================== */

function showDay(){

  calendarView.style.display = "none";

  scroll.style.display = "block";

  buildTimetable();

}


/* =====================================================
   SHOW CALENDAR
   ===================================================== */

function showCalendar(){

  scroll.style.display = "none";

  calendarView.style.display = "block";

  renderCalendar();

}


/* =====================================================
   RENDER CALENDAR
   ===================================================== */

function renderCalendar(){

  calendarContent.innerHTML = "";


  /* MONTH VIEW */

  if(calendarMode === "month"){

    const year =
      calendarDate.getFullYear();

    const month =
      calendarDate.getMonth();


    calendarTitle.textContent =
      calendarDate.toLocaleDateString(
        "en-GB",
        {
          month:"long",
          year:"numeric"
        }
      );


    const firstDay =
      new Date(year,month,1);


    const lastDay =
      new Date(year,month+1,0);


    /*
      Convert Sunday=0 to
      Monday=0.
    */

    let start =
      firstDay.getDay() - 1;

    if(start < 0){
      start = 6;
    }


    const grid =
      document.createElement("div");

    grid.className =
      "month-grid";


    const weekdays =
      [
        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat",
        "Sun"
      ];


    weekdays.forEach(day => {

      const cell =
        document.createElement("div");

      cell.className =
        "weekday";

      cell.textContent =
        day;

      grid.appendChild(cell);

    });


    /* EMPTY CELLS */

    for(let i=0;i<start;i++){

      grid.appendChild(
        document.createElement("div")
      );

    }


    /* DAYS */

    for(
      let day=1;
      day<=lastDay.getDate();
      day++
    ){

      const d =
        new Date(
          year,
          month,
          day,
          12
        );


      const key =
        dateKey(d);


      const cell =
        document.createElement("div");


      cell.innerHTML =
        "<strong>" +
        day +
        "</strong>";


      if(
        events.some(
          event =>
            event[0] === key
        )
      ){

        cell.classList.add(
          "has-event"
        );

        const dayEvents =
          events.filter(
            event =>
              event[0] === key
          );


        dayEvents.forEach(event => {

          const small =
            document.createElement("div");

          small.textContent =
            event[1] +
            " " +
            event[3];

          cell.appendChild(small);

        });

      }


      if(
        key === dateKey(selectedDate)
      ){

        cell.classList.add(
          "selected"
        );

      }


      cell.onclick = () => {

        selectedDate =
          new Date(
            year,
            month,
            day,
            12
          );

        showDay();

      };


      grid.appendChild(cell);

    }


    calendarContent.appendChild(grid);

  }


  /* YEAR VIEW */

  if(calendarMode === "year"){

    const year =
      calendarDate.getFullYear();


    calendarTitle.textContent =
      year;


    const grid =
      document.createElement("div");

    grid.className =
      "year-grid";


    for(
      let month=0;
      month<12;
      month++
    ){

      const cell =
        document.createElement("div");

      cell.className =
        "year-month";


      const d =
        new Date(
          year,
          month,
          1
        );


      cell.textContent =
        d.toLocaleDateString(
          "en-GB",
          {
            month:"long"
          }
        );


      cell.onclick = () => {

        calendarDate =
          new Date(
            year,
            month,
            1,
            12
          );

        calendarMode =
          "month";

        renderCalendar();

      };


      grid.appendChild(cell);

    }


    calendarContent.appendChild(grid);

  }


  /* DAY VIEW */

  if(calendarMode === "day"){

    calendarTitle.textContent =
      formatDate(calendarDate);


    const box =
      document.createElement("div");


    box.style.textAlign =
      "center";

    box.style.padding =
      "30px 10px";


    const key =
      dateKey(calendarDate);


    const dayEvents =
      events.filter(
        event =>
          event[0] === key
      );


    if(dayEvents.length === 0){

      box.innerHTML =
        "<strong>No timetabled events</strong>";

    }else{

      dayEvents.forEach(event => {

        const item =
          document.createElement("div");

        item.style.margin =
          "10px 0";

        item.style.padding =
          "12px";

        item.style.background =
          "#eaf4fd";

        item.style.color =
          "#236b9f";

        item.innerHTML =
          "<strong>" +
          event[3] +
          "</strong><br>" +
          event[1] +
          "–" +
          event[2];


        box.appendChild(item);

      });

    }


    calendarContent.appendChild(box);

  }

}


/* =====================================================
   CALENDAR PREVIOUS / NEXT
   ===================================================== */

document.getElementById("calendarPrev").onclick =
  () => {

    if(calendarMode === "month"){

      calendarDate.setMonth(
        calendarDate.getMonth() - 1
      );

    }

    else if(calendarMode === "year"){

      calendarDate.setFullYear(
        calendarDate.getFullYear() - 1
      );

    }

    else if(calendarMode === "day"){

      calendarDate.setDate(
        calendarDate.getDate() - 1
      );

    }

    renderCalendar();

  };


document.getElementById("calendarNext").onclick =
  () => {

    if(calendarMode === "month"){

      calendarDate.setMonth(
        calendarDate.getMonth() + 1
      );

    }

    else if(calendarMode === "year"){

      calendarDate.setFullYear(
        calendarDate.getFullYear() + 1
      );

    }

    else if(calendarMode === "day"){

      calendarDate.setDate(
        calendarDate.getDate() + 1
      );

    }

    renderCalendar();

  };


/* =====================================================
   ADD DAY / MONTH / YEAR OPTIONS TO CALENDAR BUTTON
   ===================================================== */

document.getElementById("calendarButton").onclick =
  () => {

    drawer.classList.remove("open");

    calendarMode = "month";

    calendarDate =
      new Date(selectedDate);

    calendarDate.setHours(12,0,0,0);

    showCalendar();

  };


/*
  Clicking the calendar title cycles:

  Month → Year → Day → Month

  This gives easy Day / Month / Year overview.
*/

calendarTitle.onclick = () => {

  if(calendarMode === "month"){

    calendarMode = "year";

  }

  else if(calendarMode === "year"){

    calendarMode = "day";

  }

  else{

    calendarMode = "month";

  }

  renderCalendar();

};


/* =====================================================
   START
   ===================================================== */

buildTimetable();

</script>

</body>
</html>
